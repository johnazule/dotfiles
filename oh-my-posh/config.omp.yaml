# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
  black: "#262B44"
  blue: "#4B95E9"
  green: "#59C9A5"
  light_yellow: "#FfbF46"
  orange: "#F07623"
  purple: "#8899EE"
  red: "#D81E5B"
  white: "#FFFFFF"
  yellow: "#F3AE35"
transient_prompt:
  template: "{{if gt .Code 0 }}<p:red></><p:white,p:red> {{reason .Code}} </>{{else}}<p:purple,transparent></>{{end}}<p:white,p:purple>  {{ .PWD }} </><p:purple,transparent></> "
  foreground: "#ffffff"
  background: transparent
upgrade:
  source: cdn
  interval: 168h
  auto: false
  notice: false
blocks:
  - type: prompt
    alignment: left
    leading_diamond: 
    trailing_diamond: 
    segments:
      - template: "{{ if eq .Code 0 }}{{ else }} {{ reason .Code }}{{ end }} "
        foreground: p:white
        type: status
        style: diamond
        background_templates:
          - "{{ if gt .Code 0 }}p:red{{ end }}"
      - options:
          fetch_status: true
          fetch_upstream_icon: true
          status_formats:
            Added: <p:green></><,p:green>+%d
            Deleted: <p:red></><,p:red>-%d
            Modified: <p:orange></><,p:orange>~%d
            Unmerged: <p:blue></><,p:blue>x%d
            Untracked: <p:yellow></><,p:yellow>??%d
        trailing_diamond: 
        template: "
          {{ .UpstreamIcon }}
          {{ if .Working.Changed }} 
          {{ .Working.String }}
          <background,></>\
          {{ if (gt .Working.Added 0)}}</>{{ end }}\
          {{ if (gt .Working.Deleted 0)}}</>{{ end }}\
          {{ if (gt .Working.Modified 0)}}</>{{ end }}\
          {{ if (gt .Working.Unmerged 0)}}</>{{ end }}\
          {{ if (gt .Working.Untracked 0)}}</>{{ end }}\
          {{ end }}\
          {{ if .Staging.Changed }}  {{ .Staging.String }}
          <background,></>\
          {{ if (gt .Staging.Added 0)}}</>{{ end }}\
          {{ if (gt .Staging.Deleted 0)}}</>{{ end }}\
          {{ if (gt .Staging.Modified 0)}}</>{{ end }}\
          {{ if (gt .Staging.Unmerged 0)}}</>{{ end }}\
          {{ if (gt .Staging.Untracked 0)}}</>{{ end }}\
          {{ end }}
          {{ .HEAD }}
          {{ if .BranchStatus }}{{ .BranchStatus }}{{ end }} "
        foreground: p:white
        type: git
        style: diamond
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}p:blue{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:light_yellow{{ end }}"
          - "{{ if gt .Ahead 0 }}p:purple{{ end }}"
          - "{{ if gt .Behind 0 }}p:green{{ end }}"
      - trailing_diamond: 
        template: " \U000F1617 {{ .Full }} "
        foreground: p:white
        background: p:black
        type: rust
        style: diamond
      - options:
          fetch_sdk_version: true
        trailing_diamond: 
        template: "  {{ .Full }} "
        foreground: "#000000"
        background: "#00ffff"
        type: dotnet
        style: diamond
      - options:
          folder_separator_icon: /
          mapped_locations:
            ~/.config: "\U000F08D6 "
            ~/BuildFromSource/: "\U000F062C"
            ~/Documents/Uni: " "
            ~/Music: " "
            ~/Projects/: 
            E:/Development Projects/: 
          style: agnoster_full
        template: "  {{ .Path }} "
        foreground: p:white
        background: p:purple
        type: path
        style: diamond
  - type: prompt
    alignment: left
    segments:
      - template: "  \U000F17AA"
        foreground: p:green
        type: text
        style: plain
    newline: true
    force: true
  - type: rprompt
    segments:
      - type: executiontime
        style: plain
version: 3
final_space: true
